services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-project_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-project_tracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://project_tracker:project_tracker@db:5432/project_tracker}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:13000}
    ports:
      - "${BACKEND_PORT:-18000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
